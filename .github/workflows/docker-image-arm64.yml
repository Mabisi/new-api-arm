name: Publish Docker image (arm64)

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  schedule:
    - cron: 0 0 * * *

jobs:
  push_to_docker_hub:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      # 1. 代码检出
      - name: Clone Repository
        uses: actions/checkout@v3
        with:
          repository: Calcium-Ion/new-api
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # 获取完整历史记录用于版本检测

      # 2. 设置缓存（显著加速构建）
      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 3. 版本检测（优化版）
      - name: Determine Version
        id: version
        run: |
          git fetch --tags
          # 优先使用最新tag，fallback到git describe
          LATEST_TAG=$(git tag --sort=-creatordate | head -n 1 || echo "")
          [ -z "$LATEST_TAG" ] && LATEST_TAG=$(git describe --tags --always)
          echo "VERSION=$LATEST_TAG" >> $GITHUB_ENV
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      # 4. Docker 环境设置
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64  # 明确指定只需要arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4  # 提高并行构建效率

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 构建和推送（优化参数）
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/arm64
          push: true
          cache-from: type=gha  # 启用GitHub Actions缓存
          cache-to: type=gha,mode=max
          tags: |
            happyfools/new-api:latest
            happyfools/new-api:${{ env.VERSION }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          outputs: |
            type=image,name=happyfools/new-api,push=true
